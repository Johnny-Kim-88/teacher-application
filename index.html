<!-- 3. 학력사항 -->
<div class="section-title">3. 학력사항</div>
<table class="form-table">
  <thead>
    <tr>
      <th style="width: 45%;">재학기간 (입학 ~ 졸업)</th>
      <th style="width: 20%;">학교명</th>
      <th style="width: 20%;">학과명</th>
      <th style="width: 15%;">비고</th>
    </tr>
  </thead>
  <tbody id="eduTbody">
    <!-- 1행 (기본) -->
    <tr class="edu-row">
      <td>
        <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">
          <!-- 입학 연/월 -->
          <select class="edu-start-year"></select>년
          <select class="edu-start-month"></select>월
          <span>~</span>
          <!-- 졸업 연/월 -->
          <select class="edu-end-year"></select>년
          <select class="edu-end-month"></select>월
        </div>
      </td>
      <td><input type="text" class="edu-school" placeholder="OO대학교"></td>
      <td><input type="text" class="edu-major" placeholder="OO학과"></td>
      <td><input type="text" class="edu-note" placeholder="졸업/수료"></td>
    </tr>
  </tbody>
</table>
<button type="button" onclick="addEduRow()">+ 학력 추가</button>
